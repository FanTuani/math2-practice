<script>
'use strict';
const labels = { M:'掌握', P:'不熟练', N:'不会', u:'未标记' };
const statusKeys = Object.keys(labels);
const subjects = {calc:'高数', linear:'线代'};
const matrixTypes=[['choice','选择题'],['fill','填空题'],['essay','解答题']];
const chapters = JSON.parse(document.querySelector('#taxonomy').textContent);
const papers = JSON.parse(document.querySelector('#snapshot').textContent).map(raw => {
  let offset = 0;
  const questions = raw.groups.flatMap(([type, size], group) =>
    Array.from({length:size}, (_, index) => {
      const position = ++offset;
      const section = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
      let number = String(position);

function squareLayout(nodes,box){
  const total=nodes.reduce((sum,node)=>sum+node.weight,0);
  const scale=box.w*box.h/total;
  const rest=nodes.map(node=>({node,area:node.weight*scale})).sort((a,b)=>b.area-a.area);
  const output=[];
  let {x,y,w,h}=box;
  const worst=(row,side)=>{
    const a=row.reduce((n,item)=>n+item.area,0);
    return Math.max(side*side*row[0].area/(a*a),a*a/(side*side*row.at(-1).area));
  };

    const side=Math.max(.01,vertical?h:w);
    const row=[rest.shift()];
    while (rest.length && worst([...row,rest[0]],side)<=worst(row,side)) row.push(rest.shift());
    const extent=row.reduce((n,item)=>n+item.area,0)/side;
    let offset=0;
    for(const {node,area} of row){
      const length=area/extent;
      output.push({node,x:vertical?x:x+offset,y:vertical?y+offset:y,w:vertical?extent:length,h:vertical?length:extent});
      offset+=length;
    }

  const fit=candidates.find(text=>context.measureText(text).width<=width);
  if(fit) return fit;

function fillTopicTiles(box,heading,count){
  const area={x:box.x+3,y:box.y+heading,w:Math.max(1,box.w-6),h:Math.max(1,box.h-heading-3)};
  if(count===1 && mapCount<=4){
    const size=Math.min(28,area.w,area.h);
    return [{x:area.x,y:area.y,w:size,h:size}];
  }
  const gap=Math.min(1.5,area.w/(2*count),area.h/(2*count));
  let best;
  for(let columns=1;columns<=count;columns++){
    const rows=Math.ceil(count/columns);
    const w=(area.w-gap*(columns-1))/columns;
    const maxHeight=(area.h-gap*(rows-1))/rows;
    const h=Math.min(maxHeight,Math.max(w,maxHeight*.94));
    const unused=(columns*rows-count)/(columns*rows);
    const score=Math.abs(Math.log(w/h))+.5*unused;
    if(!best||score<best.score) best={columns,w,h,score};
  }
  const {columns,w,h}=best;
  return Array.from({length:count},(_,index)=>({
    x:area.x+(index%columns)*(w+gap),

function drawMap(host,width,height,panels){

  const context=canvas.getContext('2d');
  context.scale(ratio,ratio);
  context.fillStyle=mapBackground;
  context.fillRect(0,0,width,height);
  const hits=[];
  for (const {node,box,level,heading} of panels){
    const {x,y,w,h}=box;
    const {background,band,border,text}=mapPanelThemes[level];
    context.fillStyle=background;
    context.fillRect(x,y,w,h);
    context.fillStyle=band;
    context.fillRect(x,y,w,Math.min(h,heading));
    context.strokeStyle=border;
    context.lineWidth=[1.8,1.2,1][level];
    context.strokeRect(Math.round(x)+.5,Math.round(y)+.5,Math.max(0,Math.round(w)-1),Math.max(0,Math.round(h)-1));

      const {x:left,y:top,w:tileWidth,h:tileHeight}=cells[index];
      context.beginPath();
      context.roundRect(left+.5,top+.5,tileWidth-1,tileHeight-1,2);
      context.fillStyle=mapStateFill[q.status];
      context.strokeStyle=mapStateStroke[q.status];
      context.fill();
      context.stroke();
      const title=titleText(p,q)+'，'+q.topic+'，'+labels[q.status];
      hits.push('<button type="button" class="map-target" data-q="'+p.year+'-'+q.position+'" aria-label="'+title+'" title="'+title+'" style="left:'+left+'px;top:'+top+'px;width:'+tileWidth+'px;height:'+tileHeight+'px"></button>');
    });
  }
  host.querySelector('.map-targets').innerHTML=hits.join('');
}

function fitMap(viewport){

  viewport.dataset.layout=key;
  const top=viewport.getBoundingClientRect().top+window.scrollY;
  const remainingHeight=Math.floor(window.innerHeight-top-10);
  const minimumHeight=width>=800?420:Math.max(620,Math.round(width*1.24));
  let height=mapCount<=80?Math.max(135,Math.min(400,120+mapCount*3)):
    Math.max(minimumHeight,remainingHeight);
  let panels=mapGeometry(mapTree,width,height);
  const hasRoom=()=>panels.filter(({node})=>node.items).every(({box,heading,node})=>{
    const {columns,rows}=mapCapacity(box,heading,8);

    height+=70;
    panels=mapGeometry(mapTree,width,height);
  }
  viewport.style.setProperty('--map-width',width+'px');
  viewport.style.setProperty('--map-height',height+'px');
  drawMap(viewport,width,height,panels);
}

  if(!viewport) return;
  const current=Number(viewport.dataset.zoom||1);
  const action=Number(button.dataset.zoom);
  const next=action?Math.min(2.5,Math.max(1,current+action*.25)):1;
  const middleX=(viewport.scrollLeft+viewport.clientWidth/2)/current;
  const middleY=(viewport.scrollTop+viewport.clientHeight/2)/current;
  applyMapZoom(viewport,next);
  viewport.scrollTo(action?middleX*next-viewport.clientWidth/2:0,action?middleY*next-viewport.clientHeight/2:0);
}
function applyMapZoom(viewport,zoom){
  viewport.dataset.zoom=zoom;
  viewport.style.setProperty('--zoom',zoom);
  results.querySelector('[data-zoom="0"]').textContent=zoom===1?'全图':Math.round(zoom*100)+'% · 全图';
}
function renderBank(entries){
  const scope=chapterFilter?entries.filter(({q})=>q.chapterId===chapterFilter):entries;
  const matched=searchQuestions(scope,bankSearch.value.trim());
  renderSummary(matched.map(({q})=>q));
  const visible=matched.filter(({q})=>(bankMode==='map' || isWeak(q)) && (!statusFilter || statusFilter===q.status));
  bankQuestions=visible;
  const heading=chapterFilter?chapters[chapterFilter].name:(bankMode==='map'?'题海全图':'薄弱队列');
  const controls=bankMode==='map' && visible.length?'<span class="map-actions"><button type="button" data-zoom="-1" aria-label="缩小地图">−</button><button type="button" data-zoom="0" aria-label="恢复全图">全图</button><button type="button" data-zoom="1" aria-label="放大地图">+</button></span>':'';
  results.innerHTML='<div class="bank-layout">'+bankDirectory(entries)+'<section class="bank-main"><div class="bank-head"><h2>'+heading+'</h2><button class="start-practice" data-module="scope" '+(visible.length?'':'disabled')+'>练当前筛选（'+visible.length+'）</button>'+controls+'<small role="status">'+visible.length+' 题</small></div>'+
    (bankMode==='map'?(visible.length?bankMap(visible.length):'<p class="empty">当前筛选下没有匹配的题目。</p>'):reviewMarkup(visible,true))+'</section></div>';
  const viewport=results.querySelector('.map-viewport');
  if(viewport){
    mapTree=makeMapTree(visible);
    mapCount=visible.length;
    fitMap(viewport);
    mapResize.observe(viewport);
  }
}
const viewTitles={matrix:'真题矩阵',records:'真题记录',bank:'题海',review:'待复习'};
function render(){
  mapResize.disconnect();
  document.querySelector('#view-title').textContent=viewTitles[view];
  for(const [attr,value] of [['data-view',view],['data-subject',subject],['data-bank-mode',bankMode]]){
    for(const option of document.querySelectorAll('button['+attr+']'))option.setAttribute('aria-pressed',String(option.getAttribute(attr)===value));
  }
  const rows=selectedPapers();
  bankControls.hidden=view!=='bank';
  summary.hidden=view==='matrix' || view==='records';
  document.querySelector('#record-tools').hidden=view!=='records';
  footer.hidden=view==='bank' || view==='records';
  matrixTools.hidden=view!=='matrix';
  (view==='matrix'?document.querySelector('#matrix-legend'):summary.querySelector('.distribution')).append(legend);
  const entries=rows.flatMap(p=>p.questions.filter(matchesSubject).map(q=>({p,q})));
  if (view==='bank') {
    renderBank(entries);
    return;
  }
  renderSummary(entries.map(({q})=>q));
  if(view==='matrix' || view==='records')renderMatrix(rows,entries);
  else results.innerHTML=reviewMarkup(entries.filter(({q})=>isWeak(q) && (!statusFilter || q.status===statusFilter)));
}

document.querySelector('.view-tabs').addEventListener('click',event=>{
  const tab=event.target.closest('[data-view]');
  if(!tab || view===tab.dataset.view)return;
  enterWorkspacePage();
  view=tab.dataset.view;
  statusFilter='';
  render();
});
legend.addEventListener('click',event=>{
  const button=event.target.closest('[data-status]');
  if(!button)return;
  statusFilter=statusFilter===button.dataset.status?'':button.dataset.status;
  render();
  legend.querySelector('[data-status="'+button.dataset.status+'"]')?.focus({preventScroll:true});
});
range.addEventListener('change',render);
matrixSearch.addEventListener('input',render);
bankSearch.addEventListener('input',render);
bankControls.addEventListener('click',event=>{
  const button=event.target.closest('[data-bank-mode]');
  if (!button || bankMode===button.dataset.bankMode) return;
  enterWorkspacePage();
  bankMode=button.dataset.bankMode;
  statusFilter='';
  render();
});
subjectFilter.addEventListener('click',event=>{
  const button=event.target.closest('[data-subject]');
  if (!button || subject===button.dataset.subject) return;
  subject=button.dataset.subject;
  if (chapterFilter && subject!=='all' && chapters[chapterFilter].subject!==subject) chapterFilter='';
  render();
});
results.addEventListener('click',event=>{
  const total=event.target.closest('[data-total]');
  if(total){editTotal(total);return;}
  const record=event.target.closest('[data-record]');
  if(record){activateRecord(record);return;}
  const module=event.target.closest('[data-module]');
  if(module){openModule(module.dataset.module);return;}
  const zoom=event.target.closest('[data-zoom]');
  if(zoom) {
    changeMapZoom(zoom);
    return;
  }
  const button=event.target.closest('[data-chapter]');
  if (button) {
    if(view==='bank' && button.dataset.chapter){openChapter(button.dataset.chapter);return;}
    chapterFilter=button.dataset.chapter;
    render();
    results.querySelector('[data-chapter="'+chapterFilter+'"]')?.focus({preventScroll:true});
  } else handleDetail(event);
});
const resumeKey='math2.workspace.resume.v1';
const routeCache=new Map();
const navigationType=performance.getEntriesByType('navigation')[0]?.type;
const existingRoute=navigationType==='navigate'?null:history.state?.math2Route;
let activeRoute=existingRoute || {id:nextVersion(),hasParent:false};
const scrollContainers=['#results','.matrix-scroll','.map-viewport'];
function workspacePosition(){
  const offsets={};
  for(const selector of scrollContainers){
    const el=document.querySelector(selector);
    if(el)offsets[selector]=[el.scrollLeft,el.scrollTop];
  }
  return {x:window.scrollX,y:window.scrollY,offsets,zoom:Number(results.querySelector('.map-viewport')?.dataset.zoom||1)};
}
function restoreWorkspacePosition(position){
  if(!position)return;
  const viewport=results.querySelector('.map-viewport');
  if(viewport && Number.isFinite(position.zoom))applyMapZoom(viewport,Math.max(1,Math.min(2.5,position.zoom)));
  for(const selector of scrollContainers){
    const pair=position.offsets?.[selector];
    if(Array.isArray(pair) && pair.length===2 && pair.every(Number.isFinite))document.querySelector(selector)?.scrollTo(...pair);
  }
  if(Number.isFinite(position.x) && Number.isFinite(position.y))window.scrollTo(position.x,position.y);
}
function refreshWorkspaceData(){
  const position=workspacePosition();
  render();
  restoreWorkspacePosition(position);
}
function captureWorkspace(){
  return {view,subject,bankMode,chapterFilter,statusFilter,range:range.value,
    matrixQuery:matrixSearch.value,bankQuery:bankSearch.value,position:workspacePosition(),practice:getPracticeResumeState()};
}
function saveWorkspace(snapshot=captureWorkspace()){
  routeCache.set(activeRoute.id,snapshot);
  try{sessionStorage.setItem(resumeKey+'.'+activeRoute.id,JSON.stringify(snapshot));}catch{}
}
function loadWorkspace(route){
  if(routeCache.has(route.id))return routeCache.get(route.id);
  try{return JSON.parse(sessionStorage.getItem(resumeKey+'.'+route.id));}catch{return null;}
}
function loadPreviousVersion(){
  if(navigationType!=='reload')return null;
  try{
    const saved=JSON.parse(sessionStorage.getItem(resumeKey));
    return saved?.url===location.href && Object.hasOwn(viewTitles,saved.view)?saved:null;
  }catch{return null;}
}
function enterWorkspacePage(previous){
  saveWorkspace(previous);
  const next={id:nextVersion(),hasParent:true};
  history.pushState({math2Route:next},'');
  activeRoute=next;
}
function clearPaperLink(){
  const url=new URL(location.href);
  if(!url.searchParams.has('paper'))return;
  url.searchParams.delete('paper');
  try{history.replaceState(history.state,'',url);}
  catch(error){
    if(error.name!=='SecurityError')throw error;
    location.replace(url);
  }
}
function displayWorkspace(saved){
  view=Object.hasOwn(viewTitles,saved?.view)?saved.view:'records';
  subject=Object.hasOwn(subjects,saved?.subject)?saved.subject:'all';
  bankMode=saved?.bankMode==='weak'?'weak':'map';
  chapterFilter=Object.hasOwn(chapters,saved?.chapterFilter)?saved.chapterFilter:'';
  statusFilter=statusKeys.includes(saved?.statusFilter)?saved.statusFilter:'';
  range.value=Array.from(range.options).some(o=>o.value===saved?.range)?saved.range:'all';
  matrixSearch.value=saved?.matrixQuery||'';
  bankSearch.value=saved?.bankQuery||'';
  render();
  restoreWorkspacePosition(saved?.position);
  if(saved?.practice && restorePracticeResumeState(saved.practice))return;
  if(dialog.open)dialog.close();
  if(!saved){
    const year=new URLSearchParams(location.search).get('paper');
    const paper=papers.find(p=>String(p.year)===year);
    if(paper)showPractice(paper.questions.map(q=>entriesByKey.get(paper.year+'-'+q.position)),paper.year+' 年数二原卷','list');
  }
}
const savedWorkspace=existingRoute?loadWorkspace(activeRoute):loadPreviousVersion();
history.scrollRestoration='manual';
history.replaceState({...history.state,math2Route:activeRoute},'');
if(!existingRoute && savedWorkspace?.practice){
  // Older tabs kept the parent questions inside the refresh snapshot.
  const saved=savedWorkspace.practice;
  if(!new URLSearchParams(location.search).has('paper'))enterWorkspacePage({...savedWorkspace,practice:null});
  for(const parent of saved.history||[]){
    enterWorkspacePage({...savedWorkspace,practice:{...saved,...parent,related:[parent.current],anchor:parent.current,offset:null}});
  }
}
displayWorkspace(savedWorkspace);
window.addEventListener('pagehide',()=>saveWorkspace());
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveWorkspace();});
window.addEventListener('popstate',event=>{
  const next=event.state?.math2Route;
  if(!next || next.id===activeRoute.id)return;
  saveWorkspace();
  activeRoute=next;
  displayWorkspace(loadWorkspace(next));
});
